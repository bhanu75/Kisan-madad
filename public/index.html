    <meta name="keywords" content="कृषि, फसल, किसान, खेती, भारत, डिजिटल फार्मिंग" />
    <meta name="author" content="Kisan Madad Team" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="किसान मदद - Digital Agriculture Platform" />
    <meta property="og:description" content="फसल प्रबंधन, मिट्टी की जांच, बाजार भाव और कृषि सलाह के लिए एक डिजिटल प्लेटफॉर्म" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kisan-madad.vercel.app" />
    <meta property="og:image" content="https://kisan-madad.vercel.app/og-image.png" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="किसान मदद - Digital Agriculture Platform" />
    <meta name="twitter:description" content="फसल प्रबंधन और कृषि मार्गदर्शन के लिए डिजिटल प्लेटफॉर्म" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="किसान मदद" />
    
    <!-- Google Fonts for Hindi Support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <title>किसान मदद - Digital Agriculture Platform</title>
    
    <style>
      /* Loading Spinner CSS */
      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #f3f3f3;
        border-top: 4px solid #22c55e;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      /* Initial Loading Screen */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #22c55e, #16a34a);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: white;
        font-family: 'Noto Sans Devanagari', sans-serif;
      }
      
      #loading-screen h1 {
        font-size: 2rem;
        font-weight: bold;
        margin-bottom: 1rem;
      }
      
      #loading-screen p {
        font-size: 1rem;
        opacity: 0.9;
        margin-bottom: 2rem;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-screen">
      <h1>किसान मदद</h1>
      <p>डिजिटल कृषि प्लेटफॉर्म लोड हो रहा है...</p>
      <div class="loading-spinner"></div>
    </div>
    
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 500);
        }
      });
    </script>
  </body>
</html>
